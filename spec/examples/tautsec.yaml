hero:
  name: TautSec Cyber Protect
  subtitle: Tautsec
  outcome: Posture management, Chubb cyber insurance and CyberPilot AI for Australian SMBs

card:
  problem: >-
    Australian SMBs had no single platform connecting ongoing cyber posture to
    insurance-ready outcomes — compliance evidence and cover lived in separate
    tools and channels.
  intelligence: >-
    TautSec Cyber Protect bundles Chubb-underwritten cyber insurance with a
    compliance dashboard across Direct, Broker and MSP paths. Essential Eight at
    three ACSC levels, a 0–100 Protection Index, supply chain mapping, and
    CyberPilot — AI with vector search over a compliance knowledge base.
  outcome: >-
    One workflow from scanning and posture management to CyberPilot-assisted
    remediation and Chubb insurance — across self-serve, broker and MSP channels.
    Live at tautsec.com.au.

team:
  label: Lead platform architect · team delivery
  summary: >-
    Delivered with Web4 and Program Productions for Tautsec Pty Ltd — Pete led GCP
    platform architecture, identity and AI search; product, frontend and wider engineering
    as a shared team effort.
  organizations:
    - Tautsec Pty Ltd
    - Web4
    - Program Productions

delivery:
  role: >-
    Lead architect — serverless GCP platform, Firebase Identity multi-tenant auth,
    workspace-scoped Terraform, per-tenant databases, and CyberPilot vector search.
  architecture: >-
    Three pricing tiers and dedicated flows per sales channel; 127+ Cloud Functions
    in australia-southeast1 with Terraform-managed dev/staging/prod and per-developer
    namespaces. Firestore for transactions, MongoDB Atlas per tenant plus shared KB
    for AI, BigQuery analytics. CyberPilot quick actions include site scanning,
    executive reports, 90-day plans, policy drafts, and CVE alerts cross-referenced
    to live inventory. Integrations: Chubb Cyber ERM, ABR, Stripe, Attvest, SendGrid, NVD.
  technologies:
    - React
    - TypeScript
    - Next.js
    - GCP
    - Cloud Functions
    - Terraform
    - Firestore
    - MongoDB Atlas
    - BigQuery
    - Identity Platform
    - OpenAI
    - Vector search
    - Stripe
    - Vercel
  aiCapabilities:
    - CyberPilot — vector search, session memory and source citations
    - Per-control coaching adapted to persona (solo, SMB, corporate)
    - CVE alerts vs live IT inventory and Essential Eight status
    - Guided onboarding and MFA trainer with live web research
  earthbancRelevance: >-
