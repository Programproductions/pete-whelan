  fullBrief: |
    FULL VERSION (agent reference — do not paste verbatim onto card)

    Problem: Australian SMBs faced fragmented cyber risk — point-in-time scans,
    manual Essential Eight, insurance treating compliance as afterthought.

    Platform: Chubb-underwritten insurance + SaaS dashboard; tiers Essentials /
    Professional / Enterprise; channels Direct, Broker, MSP.

    AI: CyberPilot — vector search, quick actions (scan, reports, 90-day plans,
    policies, CVE vs inventory), persona-scoped coaching, onboarding assistant,
    MFA trainer.

    Stack: React/Vite, Next.js admin, GCP Cloud Functions, Terraform, Firestore,
    MongoDB Atlas, BigQuery, OpenAI embeddings + GPT-4o.

    Integrations: Chubb Cyber ERM, ABR, Stripe, Attvest, SendGrid, NVD.
