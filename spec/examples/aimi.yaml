version: "1.0"
id: aimi
displayName: AiMi
productName: AiMi
featured: true

hero:
  name: AiMi
  outcome: Music rights intelligence and royalty recovery

card:
  problem: >-
    Labels and publishers lose revenue when catalogue and rights metadata are
    fragmented — royalty auditing is manual, slow and error-prone.
  intelligence: >-
    AiMi ingests catalogue and rights data, matches metadata with LLM orchestration
    and vector search, and surfaces auditable intelligence so teams recover missing
    royalties — not just report on them.
  outcome: >-
    Recover missing royalties. Turn catalogue chaos into auditable, scalable rights
    intelligence.

delivery:
  role: Founder & solutions architect — platform design through production delivery.
  architecture: >-
    Multi-tenant SaaS on GCP with Terraform-managed infrastructure, BigQuery analytics,
    vector retrieval and LangChain orchestration for catalogue ingestion, rights
    matching and audit workflows; human-in-the-loop review for compliance-grade outputs.
  technologies:
    - React
    - JavaScript
    - Node.js
    - OpenAI
    - GCP
    - Terraform
    - BigQuery
    - Vector database
    - LangChain
    - Firestore
    - Cloud Functions
  aiCapabilities:
    - LangChain orchestration pipelines
    - Vector search and retrieval
    - Structured evaluation of match quality
    - Human-in-the-loop review gates
  earthbancRelevance: >-
    Regulated-domain AI with audit trails and multi-tenant isolation — applicable to
    financial product engineering.

