hero:
  name: AIMI
  subtitle: aimi.app · music rights intelligence
  outcome: Recover missing royalties and resolve disputed catalog records with guided, AI-assisted workflows.

card:
  problem: >-
    Creators, labels and publishers lose time and revenue when catalogue and rights data are
    fragmented — manual auditing, slow dispute handling and inconsistent metadata leave money
    on the table.
  intelligence: >-
    AIMI combines guided creator workflows (identity, works intake, evidence-led disputes) with
    pattern detection and LLM-orchestrated catalogue matching on vector search — turning messy
    rights data into auditable intelligence, not just reports.
  outcome: >-
    Recover missing royalties and handle disputed records faster and safer — from catalogue-scale
    matching to creator-ready dispute routing. Pilot at aimi.app.

delivery:
  role: >-
    Founder & solutions architect — platform design from multi-tenant rights intelligence
    through creator-facing pilot delivery (Program Music / AIMI Platform).
  architecture: >-
    Multi-tenant SaaS foundations on GCP (Terraform, BigQuery, LangChain, vector retrieval,
    human-in-the-loop audit) plus agent-first React surfaces and Firebase-backed functions for
    guided creator flows, dispute routing and conflict detection at aimi.app.
  technologies:
    - React
    - Node.js
    - JavaScript
    - Firebase
    - GCP
    - Terraform
    - BigQuery
    - LangChain
    - Vector search
    - OpenAI
    - Firestore
    - Cloud Functions
  aiCapabilities:
    - LangChain and vector-backed catalogue matching
    - Pattern discovery and conflict detection across catalogues
    - Dispute routing suggestions with evidence-led handoff
    - Human-in-the-loop review for compliance-grade audit outputs
  earthbancRelevance: >-
    Regulated-domain AI with audit trails, dispute evidence and multi-tenant isolation —
    applicable to financial and rights-heavy data products.

